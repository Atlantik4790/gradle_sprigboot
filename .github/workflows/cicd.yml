# .github/workflows/cicd.yml
name: DevSecOps CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: myorg/springboot-app
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workspace
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and chmod gradlew
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew -type f | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found in checkout. Check repo root vs workflow path."
            exit 1
          fi
          echo "Found: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname $GRADLEW_PATH)" >> $GITHUB_ENV

      - name: Build & Unit Test
        working-directory: ${{ env.GRADLEW_DIR }}
        run: ./gradlew build

  sast-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/java

  dependency-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: OWASP Dependency Check
      continue-on-error: true
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'springboot-app'
        format: 'HTML'

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dep-check-report
        path: reports/
        if-no-files-found: warn

  docker-build-scan-push:
    needs: [sast-scan, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Push image
        run: docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

  deploy:
    needs: docker-build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop springboot-app || true
            docker rm springboot-app || true
            docker run -d --name springboot-app -p 80:8080 \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
